name: Tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    env:
      CI: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.node-version'
      - name: Install dependencies
        run: npm ci
      # The images enhanced-img makes from src/lib/assets/images. Without them the dev server's
      # first page takes minutes, as it encodes every image; after npm ci, which clears node_modules.
      - name: Restore generated images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules/.cache/imagetools
          key: imagetools-${{ hashFiles('src/lib/assets/images/**', 'package-lock.json') }}
          restore-keys: imagetools-
      - name: Run unit tests
        run: npm run test:unit
      - name: Run Playwright tests
        run: npx playwright test --project=ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
